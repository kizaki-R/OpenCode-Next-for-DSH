name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Provision peer schemastery into test DSH profile
        shell: bash
        run: |
          mkdir -p "$DSH_HOME/profiles/desktop"
          npm --prefix "$DSH_HOME/profiles/desktop" install --no-save "@deepseek-ai/schemastery@>=3.18.0"
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home

      - name: Syntax check
        run: npm run check

      - name: Run test suite
        run: npm test
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
